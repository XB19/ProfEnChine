{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Prof AI Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="{% static 'dashboard/css/dashboard.css' %}">
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="logo">Le Prof AI</div>

    <a href="{% url 'dashboard_home' %}">
        <i class="bi bi-grid-1x2-fill"></i> Dashboard
    </a>

    <a href="{% url 'prospects_list' %}">
        <i class="bi bi-people-fill"></i> Prospects
    </a>

{% comment %}     <a href="{% url 'conversations_inbox' %}">
        <i class="bi bi-chat-dots-fill"></i> Conversations
    </a> {% endcomment %}

    <a href="#">
        <i class="bi bi-robot"></i> IA Assistant
    </a>

    <a href="#">
        <i class="bi bi-bar-chart-fill"></i> Analytics
    </a>

    <a href="#">
        <i class="bi bi-gear-fill"></i> Settings
    </a>

</div>

<!-- MAIN -->
<div class="main-content">

    <!-- TOPBAR -->
    <div class="topbar">
        <h2>Dashboard IA</h2>
        <p>Gestion intelligente des conversations WhatsApp et PDF</p>
    </div>

    {% block content %}
    {% endblock %}

</div>

</body>
</html>

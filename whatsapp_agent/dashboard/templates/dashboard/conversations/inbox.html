{% extends 'dashboard/base.html' %}

{% block content %}

<style>
.inbox-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 20px;
}

.inbox-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    transition: 0.2s;
}

.inbox-card:hover {
    transform: translateY(-2px);
    border-color: #d1d5db;
}

.inbox-left {
    display: flex;
    flex-direction: column;
}

.phone {
    font-weight: 600;
    color: #111827;
}

.meta {
    font-size: 12px;
    color: #6b7280;
}

.open-btn {
    background: #111827;
    color: white;
    padding: 8px 12px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 13px;
}
</style>

<div class="inbox-title">
    Conversations WhatsApp
</div>

{% for c in conversations %}

<div class="inbox-card">

    <div class="inbox-left">

        <div class="phone">
            {{ c.phone_number }}
        </div>

        <div class="meta">
            {{ c.total_messages }} messages
        </div>

    </div>

    <a href="{% url 'prospect_detail' c.phone_number %}" class="open-btn">
        Ouvrir
    </a>

</div>

{% empty %}

<p>Aucune conversation trouvée</p>

{% endfor %}

{% endblock %}
